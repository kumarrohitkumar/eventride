name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint · typecheck · unit + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version input on purpose: package.json's `packageManager` field pins pnpm exactly, and
      # passing both makes pnpm/action-setup@v4 fail with "multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  mobile-apps:
    name: Mobile apps — typecheck + bundle
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      # No version input on purpose: package.json's `packageManager` field pins pnpm exactly, and
      # passing both makes pnpm/action-setup@v4 fail with "multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # A bundle failure is the only way to catch a broken import or screen without a device.
      - run: pnpm bundle:check

  simulation-gate:
    name: Peak-arrival simulation gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      # No version input on purpose: package.json's `packageManager` field pins pnpm exactly, and
      # passing both makes pnpm/action-setup@v4 fail with "multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Fails the build if capacity is ever violated, a guest is starved,
      # or wait p95 exceeds the SLA (PRD §19.3, HLD §13).
      - run: pnpm sim:peak

  integration:
    name: Integration tests (MySQL)
    runs-on: ubuntu-latest
    needs: quality
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eventride_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/eventride_test?timezone=UTC
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-test-secret-not-for-production
      ROUTING_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      # No version input on purpose: package.json's `packageManager` field pins pnpm exactly, and
      # passing both makes pnpm/action-setup@v4 fail with "multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @eventride/api prisma migrate deploy
      - run: pnpm test:integration
